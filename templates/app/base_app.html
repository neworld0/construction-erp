<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block page_title %}ERP{% endblock %}</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #101a2b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --warn: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR",
          "Segoe UI", sans-serif;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        min-height: 32px;
      }
      .nav-left,
      .nav-right {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
      }
      .brand {
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 32px;
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #f89e38, #e9a40e);
        box-shadow: 0 6px 16px rgba(15, 118, 110, 0.35);
        color: #0b1220;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.6px;
      }
      .nav-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
      }
      .nav-link:hover {
        color: var(--text);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0 12px;
        line-height: 32px;
        border-radius: 8px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        font-size: 12px;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.4);
        color: var(--text);
      }
      .nav-right form {
        display: inline-flex;
        align-items: center;
        height: 32px;
        margin: 0;
      }
      main {
        padding: 20px;
      }
      .card {
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      }
      .alert {
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .alert-danger {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
      }
      .form-control {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: transparent;
        color: var(--text);
        width: 100%;
      }
      input[type="date"] {
        color-scheme: dark;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zm12 8H5v10h14V10zM5 8h14V6H5v2z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 16px 16px;
        padding-right: 38px;
        cursor: pointer;
      }
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="month"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0;
      }
      input[type="month"] {
        color-scheme: dark;
      }
      input[type="month"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
      }
      select,
      option {
        background: #0f172a;
        color: var(--text);
      }
      .form-label {
        font-size: 13px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
      }
      .mb-3 {
        margin-bottom: 12px;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header>
      <div class="nav">
        <div class="nav-left">
          <a class="brand" href="/app/">
            <span class="brand-mark" aria-label="ASAN">ASAN ERP</span>
          </a>
        </div>
        <div class="nav-right">
  <a class="btn btn-outline" href="/">홈페이지로</a>
  {% if request.user.is_authenticated %}
  <form method="post" action="/logout/">
    {% csrf_token %}
    <button class="btn" type="submit">로그아웃</button>
  </form>
  {% endif %}
</div>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script>
      document.querySelectorAll('input[type="date"]').forEach(function (input) {
        input.addEventListener("click", function () {
          if (typeof input.showPicker === "function") {
            input.showPicker();
          }
        });
      });
    </script>
  </body>
</html>
