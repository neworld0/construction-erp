{% extends "app/base_app.html" %}

{% block page_title %}월 마감 요청{% endblock %}

{% block content %}
<div class="card">
  <h2 class="card-title">월 마감 요청 생성</h2>
  <p class="muted">마감 요청은 CEO 승인 후 실행됩니다.</p>
</div>

<div class="card" style="margin-top: 18px;">
  <form method="post">
    {% csrf_token %}
    <div style="display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <label>
        연도
        <input class="input" type="number" name="year" placeholder="예: 2026" required />
      </label>
      <label>
        월
        <input class="input" type="number" name="month" min="1" max="12" placeholder="1~12" required />
      </label>
      <label style="grid-column: 1 / -1;">
        비고
        <textarea class="input" name="note" rows="3" placeholder="선택 사항"></textarea>
      </label>
    </div>
    <div style="margin-top:16px; display:flex; gap:8px;">
      <button class="btn" type="submit">요청 생성</button>
      <a class="btn btn-outline" href="/app/hq/closing/">취소</a>
    </div>
  </form>
</div>
{% endblock %}
