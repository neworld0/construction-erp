{% extends "app/base_app.html" %}

{% block page_title %}본사 직원 로그인 계정 등록{% endblock %}

{% block content %}
<div class="container">
  <div class="card" style="max-width:680px">
    <h2>본사 직원 로그인 계정 등록</h2>
    <p class="hint">급여명세서 조회를 위한 로그인 계정입니다. HQ·CEO 권한은 부여되지 않습니다.</p>
    <form method="post">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <input class="input" name="username" placeholder="로그인 아이디" required autocomplete="username">
        <input class="input" name="last_name" placeholder="성명" required>
        <input class="input" type="password" name="password" placeholder="임시 비밀번호" required autocomplete="new-password">
        <input class="input" type="password" name="password_confirm" placeholder="임시 비밀번호 확인" required autocomplete="new-password">
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="submit">로그인 계정 등록</button>
        <a class="btn btn-outline" href="/app/hq/labor/office-payroll/">목록으로</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
