{% extends "app/base_app.html" %}
{% block page_title %}운영 테스트 날짜 설정{% endblock %}
{% block content %}
<div class="card"><h2 class="card-title">운영 테스트 날짜 허용 기간</h2><p class="muted">{{ project.name }}에만 적용됩니다. FIELD의 미래 날짜 입력을 지정 기간에 한해 허용하며, 자동 해제일 이후에는 즉시 차단됩니다. 월·프로젝트 마감 제한은 해제하지 않습니다.</p></div>
<div class="card" style="margin-top:16px;"><form method="post">{% csrf_token %}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;"><label>입력 허용 시작일<input class="input" type="date" name="start_date" value="{{ window.start_date|date:'Y-m-d'|default:today|date:'Y-m-d' }}" required></label><label>입력 허용 종료일<input class="input" type="date" name="end_date" value="{{ window.end_date|date:'Y-m-d'|default:project.end_date|date:'Y-m-d' }}" required></label><label>자동 해제일<input class="input" type="date" name="expires_on" value="{{ window.expires_on|date:'Y-m-d'|default:today|date:'Y-m-d' }}" required></label></div><label style="display:block;margin-top:12px;">테스트 사유<textarea class="input" name="reason" required>{% if window %}{{ window.reason }}{% else %}V4 운영 시나리오 검증{% endif %}</textarea></label><label style="display:block;margin-top:12px;"><input type="checkbox" name="is_enabled" value="1" {% if not window or window.is_enabled %}checked{% endif %}> 허용 기간 사용</label><div style="display:flex;gap:8px;margin-top:14px;"><button class="btn" type="submit">저장</button><a class="btn btn-outline" href="/app/hq/projects/{{ project.id }}/">프로젝트로 돌아가기</a></div></form></div>
{% endblock %}
