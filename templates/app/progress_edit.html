{% extends "app/base_app.html" %}
{% block page_title %}진행률 수정{% endblock %}
{% block content %}
<style>
  :root { --primary: var(--action); }
  .container {
    display: grid;
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
  }
  form {
    display: grid;
    gap: 12px;
  }
  label {
    font-size: 13px;
    color: var(--muted);
  }
  input,
  select,
  textarea,
  button {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    width: 100%;
    background: transparent;
    color: var(--text);
  }
  button {
    background: var(--primary);
    color: var(--action-text);
    border: 0;
    cursor: pointer;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0 12px;
  }
</style>

<div class="container field-page field-entry-page">
  <div class="card">
    <div class="field-entry-header">
      <h2>진행률 수정</h2>
      <span class="subtitle">제출 전 임시저장 항목을 수정할 수 있습니다.</span>
    </div>
    <form method="post" class="field-entry-form">
      {% csrf_token %}
      <div class="field-form-grid">
        <div class="field-form-field field-form-field--full">
          <label for="task_id">태스크</label>
          <select id="task_id" name="task_id" required>
            {% for task in tasks %}
            <option value="{{ task.id }}" {% if task.id == progress.task_id %}selected{% endif %}>{{ task.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field-form-field">
          <label for="progress_percent">진행률(%)</label>
          <input id="progress_percent" name="progress_percent" type="number" step="0.001" min="0" max="100" value="{{ progress.progress_percent }}" required />
        </div>
        <div class="field-form-field">
          <label for="report_date">작성일</label>
          <input id="report_date" type="date" value="{{ progress.report_date }}" disabled />
        </div>
        <div class="field-form-field field-form-field--full">
          <label for="note">메모</label>
          <textarea id="note" name="note" rows="2">{{ progress.note }}</textarea>
        </div>
      </div>
      <input type="hidden" name="report_date" value="{{ progress.report_date }}" />
      <div class="field-form-actions">
        <button type="submit" name="action" value="draft">임시저장</button>
        <button type="submit" name="action" value="submit">제출</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
