{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block page_title %}{{ site_title }}{% endblock %}</title>
    <meta name="description" content="{{ meta_description }}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'public_site/site.css' %}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">{{ site_title }}</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/about/">회사소개</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/projects/">주요실적</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/partners/">협력업체</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact/">문의</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="bg-dark text-light py-4 mt-5">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-8 small">
            <div>회사명: {{ company_name }}</div>
            <div>대표이사: {{ company_ceo }}</div>
            <div>주소: {{ company_address }}</div>
            <div>
              전화: <a class="text-light" href="tel:{{ company_phone }}">{{ company_phone }}</a>
            </div>
          </div>
          <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a class="btn btn-warning" href="{{ erp_login_url }}">ERP로 이동</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
